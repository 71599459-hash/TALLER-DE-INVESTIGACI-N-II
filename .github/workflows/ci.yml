name: Pruebas de AulaRaíz
on:
  push:
    branches: [main, 'mejoras/**']
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify
